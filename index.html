<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enhanced Landing Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      color: #102a43;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-container {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 30px;
      width: 100%;
      max-width: 600px;
      transition: transform 0.3s ease;
    }

    .form-container:hover {
      transform: translateY(-5px);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #334e68;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #bcccdc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
      margin-top: 6px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #3e4c59;
      box-shadow: 0 0 0 3px rgba(62, 76, 89, 0.2);
      outline: none;
    }

    textarea {
      resize: vertical;
    }

    .gender-options {
      display: flex;
      gap: 15px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .gender-options label {
      font-weight: normal;
    }

    button {
      margin-top: 25px;
      width: 100%;
      background: linear-gradient(to right, #3e4c59, #627d98);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #627d98, #3e4c59);
    }

    .bonus-section {
      background-color: #ffffff;
      margin-top: 40px;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }

    .bonus-section h2 {
      font-size: 18px;
      color: #102a43;
      border-bottom: 1px solid #bcccdc;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .bonus-section ul {
      padding-left: 20px;
    }

    .bonus-section li {
      margin-bottom: 8px;
      line-height: 1.5;
      color: #334e68;
    }
  </style>
</head>
<body>
  <h1>Enhanced Google Form-like Landing Page</h1>

  <div class="form-container">
    <form>
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required />

      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" name="contact" required />

      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3" required></textarea>

      <label for="company">Company Name</label>
      <input type="text" id="company" name="company" />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required />

      <label for="department">Department</label>
      <select id="department" name="department" required>
        <option value="">Select Department</option>
        <option>HR</option>
        <option>Sales</option>
        <option>Development</option>
        <option>Marketing</option>
        <option>Others</option>
      </select>

      <label>Gender</label>
      <div class="gender-options">
        <label><input type="radio" name="gender" value="male" required> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="prefer-not-to-say"> Prefer not to say</label>
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>

  <div class="bonus-section">
    <h2>Bonus (Optional for extra points):</h2>
    <ul>
      <li>Add a simple hover effect on the submit button.</li>
      <li>Make the background color of the form different from the page background.</li>
      <li>Add a minimalistic box-shadow to the form.</li>
    </ul>
  </div>
</body>
</html>
